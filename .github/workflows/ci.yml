name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # test:unit excludes e2e.test.js, which needs a live TradingView Desktop + CDP.
        run: npm run test:unit

      - name: MT5 bridge unit tests (Python)
        # Covers mt5-bridge/normalize.py only — pure logic with no MetaTrader5
        # import, so it runs on Linux. Terminal I/O in mt5_client.py needs
        # Windows + a running MT5 and is not exercised here.
        run: python3 -m unittest discover -s mt5-bridge

      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
